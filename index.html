<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0d0d" />
    <title>Азим Чарыев — режиссёр и креативный продюсер</title>
    <meta
      name="description"
      content="Азим Чарыев — видеограф и режиссёр. Контент, фото и продакшн для брендов, которые не хотят быть как все."
    />
    <meta property="og:title" content="Азим Чарыев — режиссёр и креативный продюсер" />
    <meta property="og:description" content="Контент, фото и продакшн для брендов, которые не хотят быть как все." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://azimcharyev.ru/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <!-- Прелоадер лежит в разметке, а не рисуется React: он должен быть на
         экране с первого кадра, до того как выполнится модуль. Проценты и
         свечение доводит src/preloader.ts, он же убирает этот блок. -->
    <div class="preloader" role="status" aria-live="polite">
      <div class="preloader__glow"></div>
      <div class="preloader__grain"></div>
      <div class="preloader__copy">
        <div class="preloader__text">
          <p class="preloader__value">0%</p>
          <p class="preloader__note">Сайт загружается,<br />пожалуйста подождите</p>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
