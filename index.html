<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0d0d" />
    <title>Азим Чарыев — видеограф</title>
    <meta
      name="description"
      content="Азим Чарыев — видеограф и режиссёр. Контент, фото и продакшн для брендов, которые не хотят быть как все."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d0d0d'/%3E%3Cpath d='M6 9h13a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H6z' fill='%23FF4D00'/%3E%3Cpath d='M23 13l4-2v10l-4-2z' fill='%23FFBB00'/%3E%3C/svg%3E" />
  </head>
  <body>
    <!-- Прелоадер лежит в разметке, а не рисуется React: он должен быть на
         экране с первого кадра, до того как выполнится модуль. Проценты и
         свечение доводит src/preloader.ts, он же убирает этот блок. -->
    <div class="preloader" role="status" aria-live="polite">
      <div class="preloader__glow"></div>
      <div class="preloader__grain"></div>
      <div class="preloader__copy">
        <div class="preloader__text">
          <p class="preloader__value">0%</p>
          <p class="preloader__note">Сайт загружается,<br />пожалуйста подождите</p>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
